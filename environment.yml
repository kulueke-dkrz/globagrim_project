name: globagrim_env
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.13
  - numpy=2.2.6
  - xarray=2025.9.0
  - netcdf4=1.7.2
  - matplotlib=3.10.6
  - shapely=2.1.1
  - cartopy=0.25.0
  - numba=0.61.2
  - jupyter
  - pytest
  - sphinx
  - pip
  - pip:
    - "git+https://github.com/MarcoKulueke/globagrim_project.git#egg=globagrim"
